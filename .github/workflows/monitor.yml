name: Shop Monitor

on:
  schedule:
    - cron: '0 11 * * *'
  repository_dispatch:
    types: [run-monitor]
  workflow_dispatch:        # ← これを追加


jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python shop_monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save snapshot back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shop_snapshot.json
          git diff --cached --quiet || git commit -m "chore: update shop snapshot [skip ci]"
          git push
      - name: Send error notification
        if: failure()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ エラー発生\",\"description\":\"ショップ監視でエラーが発生しました\",\"color\":16711680}]}"
